<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Abdul Aleem Matin - Web Developer Portfolio">
<title>Abdul Aleem Matin | Portfolio</title>
<style>
:root {
  --bg:#07070b; --panel:rgba(18,18,28,.72); --text:#f6f7fb; --muted:#a8adbd;
  --yellow:#ffc400; --orange:#ff8a00; --blue:#4f7cff; --line:rgba(255,255,255,.09);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:Inter,Arial,sans-serif;background:var(--bg);color:var(--text);overflow-x:hidden}
body:before{content:"";position:fixed;inset:0;pointer-events:none;z-index:-2;background:
radial-gradient(circle at 10% 20%,rgba(255,140,0,.12),transparent 25%),
radial-gradient(circle at 85% 25%,rgba(79,124,255,.11),transparent 24%)}
a{color:inherit;text-decoration:none}
.container{width:min(1180px,calc(100% - 40px));margin:auto}
nav{position:fixed;top:18px;left:50%;transform:translateX(-50%);width:min(1100px,calc(100% - 32px));z-index:50;
display:flex;align-items:center;justify-content:space-between;padding:14px 20px;border:1px solid var(--line);
background:rgba(8,8,13,.72);backdrop-filter:blur(18px);border-radius:20px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.logo{font-size:20px;font-weight:900;letter-spacing:-1px} .logo span{color:var(--yellow)}
.navlinks{display:flex;gap:24px;color:var(--muted);font-size:14px}
.navlinks a:hover{color:var(--yellow)}
.nav-btn,.btn{display:inline-flex;align-items:center;justify-content:center;padding:13px 20px;border-radius:14px;font-weight:800;transition:.25s}
.nav-btn{background:var(--yellow);color:#111} .nav-btn:hover,.btn:hover{transform:translateY(-3px);box-shadow:0 12px 30px rgba(255,196,0,.2)}
 
.hero{min-height:100vh;display:grid;align-items:center;padding:130px 0 70px;position:relative}
.hero-grid{display:grid;grid-template-columns:1fr 1fr;gap:50px;align-items:center}
.badge{display:inline-flex;gap:9px;align-items:center;padding:9px 13px;border:1px solid var(--line);border-radius:999px;color:#d7d9e3;background:rgba(255,255,255,.035);font-size:13px}
.dot{width:9px;height:9px;border-radius:50%;background:#45d483;box-shadow:0 0 15px #45d483}
h1{font-size:clamp(54px,8vw,104px);line-height:.92;letter-spacing:-6px;margin:22px 0}
h1 .stroke{color:transparent;-webkit-text-stroke:1px #737887}
h1 strong{color:var(--yellow)}
.hero p{max-width:560px;font-size:18px;line-height:1.8;color:var(--muted)}
.hero-actions{display:flex;gap:14px;margin-top:28px;flex-wrap:wrap}
.btn.primary{background:linear-gradient(135deg,var(--yellow),var(--orange));color:#141006}
.btn.secondary{border:1px solid var(--line);background:rgba(255,255,255,.03)}
 
.visual{position:relative;min-height:610px;perspective:1500px}
.glow{position:absolute;width:420px;height:420px;background:radial-gradient(circle,rgba(255,196,0,.34),transparent 67%);filter:blur(25px);top:80px;left:70px}
.hero-card{position:absolute;inset:15px 0 0 20px;border-radius:44px;overflow:hidden;transform:rotateY(-8deg) rotateX(3deg);box-shadow:35px 45px 90px rgba(0,0,0,.55);transition:.5s}
.hero-card:hover{transform:rotateY(0) rotateX(0) translateY(-10px)}
.hero-card img{width:100%;height:100%;object-fit:cover;object-position:center}
.floating{position:absolute;background:rgba(16,16,23,.75);border:1px solid rgba(255,255,255,.12);backdrop-filter:blur(16px);border-radius:18px;padding:15px 18px;box-shadow:0 20px 50px rgba(0,0,0,.32)}
.floating b{font-size:24px;color:var(--yellow);display:block} .f1{top:40px;right:-10px} .f2{bottom:40px;left:-25px}
 
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:45px}
.stat{padding:18px;border:1px solid var(--line);background:var(--panel);border-radius:18px}
.stat b{display:block;font-size:30px;color:var(--yellow)} .stat span{font-size:13px;color:var(--muted)}
 
section{padding:110px 0}
.kicker{color:var(--yellow);text-transform:uppercase;letter-spacing:2px;font-size:12px;font-weight:900}
.title{font-size:clamp(38px,5vw,66px);letter-spacing:-3px;margin-top:12px;line-height:1}
.section-head{max-width:700px;margin-bottom:45px}
.section-head p{color:var(--muted);line-height:1.7;margin-top:16px}
 
.about{display:grid;grid-template-columns:.9fr 1.1fr;gap:70px;align-items:center}
.about-photo{height:590px;position:relative;perspective:1000px}
.about-photo:before{content:"";position:absolute;inset:45px -10px -10px 35px;border-radius:35px;background:linear-gradient(135deg,var(--yellow),transparent);transform:rotate(5deg);opacity:.35}
.about-photo img{position:absolute;width:100%;height:100%;object-fit:cover;border-radius:35px;border:1px solid var(--line);transform:rotateY(7deg);box-shadow:30px 35px 70px rgba(0,0,0,.5)}
.about-text p{color:var(--muted);line-height:1.85;font-size:17px;margin:18px 0}
.info-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-top:25px}
.info{padding:17px;border-radius:16px;border:1px solid var(--line);background:rgba(255,255,255,.025)} .info small{color:var(--muted);display:block;margin-bottom:5px}
 
.skills{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}
.skill{min-height:220px;padding:24px;border-radius:24px;background:linear-gradient(145deg,rgba(255,255,255,.06),rgba(255,255,255,.015));border:1px solid var(--line);transform-style:preserve-3d;transition:.35s}
.skill:hover{transform:translateY(-12px) rotateX(5deg) rotateY(-5deg);border-color:rgba(255,196,0,.45)}
.icon{font-size:36px;margin-bottom:40px} .skill h3{font-size:21px} .skill p{color:var(--muted);font-size:14px;line-height:1.6;margin-top:8px}
 
.projects{display:grid;grid-template-columns:repeat(2,1fr);gap:22px}
.project{position:relative;min-height:440px;overflow:hidden;border-radius:28px;border:1px solid var(--line);background:#12121b;transition:.35s;transform-style:preserve-3d}
.project:hover{transform:translateY(-10px) rotateX(2deg)}
.project:before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 35%,rgba(0,0,0,.9));z-index:1}
.project img{width:100%;height:100%;object-fit:cover;transition:.5s;opacity:.78}
.project:hover img{transform:scale(1.06)}
.project-content{position:absolute;z-index:2;left:28px;right:28px;bottom:26px}
.project-tag{color:var(--yellow);font-size:12px;font-weight:800;letter-spacing:1px} .project h3{font-size:30px;margin:8px 0}
.project p{color:#c6c8d2;font-size:14px;line-height:1.6}
.project.wide{grid-column:span 2;min-height:330px}
 
.timeline{border-left:1px solid var(--line);margin-left:10px}
.time{position:relative;padding:0 0 42px 35px} .time:before{content:"";position:absolute;width:13px;height:13px;border-radius:50%;left:-7px;top:5px;background:var(--yellow);box-shadow:0 0 0 6px rgba(255,196,0,.1)}
.time small{color:var(--yellow);font-weight:800} .time h3{font-size:23px;margin:8px 0} .time p{color:var(--muted);line-height:1.7}
 
.contact{padding-bottom:120px}
.contact-box{padding:60px;border:1px solid var(--line);border-radius:36px;background:radial-gradient(circle at 80% 10%,rgba(255,196,0,.15),transparent 25%),linear-gradient(145deg,rgba(255,255,255,.055),rgba(255,255,255,.01));display:flex;align-items:center;justify-content:space-between;gap:30px}
.contact-box h2{font-size:clamp(42px,6vw,78px);letter-spacing:-4px;line-height:.95;max-width:650px}
.contact-details{display:flex;flex-wrap:wrap;gap:10px 18px;margin-top:25px;color:var(--muted);font-size:14px}
.contact-details a{color:var(--text);transition:.2s}.contact-details a:hover{color:var(--yellow)}
.contact-actions{display:flex;flex-direction:column;gap:12px;min-width:210px}
 
footer{border-top:1px solid var(--line);padding:30px 0;color:var(--muted);font-size:14px}
.footer-inner{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap}
 
.reveal{opacity:0;transform:translateY(30px);transition:opacity .8s ease,transform .8s ease}
.reveal.show{opacity:1;transform:none}
 
@media(max-width:900px){
  .hero-grid,.about{grid-template-columns:1fr} .hero{padding-top:140px} .visual{min-height:560px;order:-1}
  .skills{grid-template-columns:repeat(2,1fr)} .navlinks{display:none} .stats{max-width:600px}
  .contact-box{padding:40px;display:block} .contact-box .btn{margin-top:30px}
}
@media(max-width:620px){
  .container{width:min(100% - 28px,1180px)} nav{top:10px;width:calc(100% - 20px);padding:12px 14px}
  h1{letter-spacing:-3px} .nav-btn{padding:10px 13px;font-size:12px}
  .visual{min-height:480px} .hero-card{inset:10px 0 0 0;border-radius:28px}
  .stats{grid-template-columns:1fr 1fr} .stat:last-child{grid-column:span 2} .about-photo{height:470px}
  .skills,.projects,.info-grid{grid-template-columns:1fr} .project.wide{grid-column:auto;min-height:440px}
  .contact-box{padding:30px} section{padding:75px 0}
}
</style>
</head>
