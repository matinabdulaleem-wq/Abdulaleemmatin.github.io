<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<meta name="theme-color" content="#050507">

<title>Abdul Aleem Matin | Developer</title>

<link rel="preconnect"
href="https://fonts.googleapis.com">

<link rel="preconnect"
href="https://fonts.gstatic.com"
crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

<style>

/* =========================================
   RESET
========================================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:"Inter",sans-serif;
    background:#050507;
    color:#ffffff;
    overflow-x:hidden;
}

/* =========================================
   VARIABLES
========================================= */

:root{

    --bg:#050507;

    --card:#0d0d12;

    --card2:#111119;

    --text:#ffffff;

    --muted:#96969f;

    --purple:#7c3aed;

    --purple-light:#a855f7;

    --blue:#2997ff;

    --yellow:#ffd60a;

    --green:#30d158;

    --border:rgba(255,255,255,.10);

}

/* =========================================
   BACKGROUND
========================================= */

body::before{

    content:"";

    position:fixed;

    inset:0;

    pointer-events:none;

    z-index:-2;

    background:

    radial-gradient(
        circle at 10% 15%,
        rgba(41,151,255,.13),
        transparent 28%
    ),

    radial-gradient(
        circle at 85% 20%,
        rgba(124,58,237,.15),
        transparent 30%
    ),

    radial-gradient(
        circle at 50% 90%,
        rgba(255,214,10,.06),
        transparent 35%
    );

}

/* GRID BACKGROUND */

body::after{

    content:"";

    position:fixed;

    inset:0;

    pointer-events:none;

    z-index:-3;

    opacity:.15;

    background-image:

    linear-gradient(
        rgba(255,255,255,.03) 1px,
        transparent 1px
    ),

    linear-gradient(
        90deg,
        rgba(255,255,255,.03) 1px,
        transparent 1px
    );

    background-size:70px 70px;

}

/* =========================================
   CONTAINER
========================================= */

.container{

    width:min(1180px,92%);

    margin:auto;

}

/* =========================================
   NAVBAR
========================================= */

nav{

    position:fixed;

    top:18px;

    left:50%;

    transform:translateX(-50%);

    width:min(1150px,92%);

    height:68px;

    padding:0 24px;

    display:flex;

    align-items:center;

    justify-content:space-between;

    border-radius:22px;

    background:rgba(10,10,15,.78);

    backdrop-filter:blur(25px);

    -webkit-backdrop-filter:blur(25px);

    border:1px solid var(--border);

    z-index:1000;

    box-shadow:
    0 15px 50px rgba(0,0,0,.35);

}

.logo{

    text-decoration:none;

    color:white;

    font-size:23px;

    font-weight:900;

    letter-spacing:-1px;

}

.logo span{

    color:var(--purple-light);

}

.navlinks{

    display:flex;

    gap:30px;

}

.navlinks a{

    text-decoration:none;

    color:#a0a0aa;

    font-size:13px;

    font-weight:600;

    transition:.3s;

}

.navlinks a:hover{

    color:white;

}

.nav-btn{

    text-decoration:none;

    color:#050507;

    background:white;

    padding:11px 18px;

    border-radius:14px;

    font-size:13px;

    font-weight:800;

    transition:.3s;

}

.nav-btn:hover{

    transform:scale(1.06);

    box-shadow:
    0 10px 30px
    rgba(255,255,255,.2);

}

/* =========================================
   HERO
========================================= */

.hero{

    min-height:100vh;

    display:flex;

    align-items:center;

    padding:130px 0 70px;

}

.hero-grid{

    display:grid;

    grid-template-columns:
    1.1fr .9fr;

    align-items:center;

    gap:60px;

}

.badge{

    display:inline-flex;

    align-items:center;

    gap:10px;

    padding:10px 16px;

    border-radius:50px;

    border:1px solid var(--border);

    background:
    rgba(255,255,255,.04);

    color:#b4b4bc;

    font-size:13px;

}

.dot{

    width:9px;

    height:9px;

    border-radius:50%;

    background:var(--green);

    box-shadow:
    0 0 18px var(--green);

}

.hero h1{

    font-size:
    clamp(58px,8vw,110px);

    line-height:.88;

    letter-spacing:-7px;

    margin:28px 0;

    font-weight:900;

}

.gradient{

    background:

    linear-gradient(
        90deg,
        #ffffff,
        #9d72ff,
        #2997ff
    );

    -webkit-background-clip:text;

    background-clip:text;

    color:transparent;

}

.hero-text{

    color:var(--muted);

    max-width:580px;

    font-size:17px;

    line-height:1.9;

}

.hero-text b{

    color:white;

}

/* =========================================
   BUTTONS
========================================= */

.buttons{

    display:flex;

    gap:14px;

    flex-wrap:wrap;

    margin-top:30px;

}

.btn{

    text-decoration:none;

    padding:15px 22px;

    border-radius:16px;

    font-size:14px;

    font-weight:800;

    transition:.35s;

}

.primary{

    color:white;

    background:

    linear-gradient(
        135deg,
        var(--purple),
        var(--blue)
    );

    box-shadow:
    0 15px 40px
    rgba(124,58,237,.25);

}

.secondary{

    color:white;

    border:1px solid var(--border);

    background:
    rgba(255,255,255,.04);

}

.btn:hover{

    transform:
    translateY(-5px)
    scale(1.03);

}

/* =========================================
   STATS
========================================= */

.stats{

    display:grid;

    grid-template-columns:
    repeat(3,1fr);

    gap:12px;

    margin-top:45px;

}

.stat{

    padding:20px;

    border-radius:20px;

    background:
    rgba(255,255,255,.035);

    border:
    1px solid var(--border);

}

.stat h3{

    font-size:26px;

    color:#b48cff;

}

.stat p{

    font-size:12px;

    color:var(--muted);

    margin-top:6px;

}

/* =========================================
   HERO 3D VISUAL
========================================= */

.visual{

    height:560px;

    position:relative;

    perspective:1200px;

}

.orbit{

    position:absolute;

    width:420px;

    height:420px;

    left:50%;

    top:50%;

    transform:
    translate(-50%,-50%)
    rotateX(68deg);

    border-radius:50%;

    border:
    1px solid
    rgba(168,85,247,.35);

    animation:
    spin 15s linear infinite;

}

.orbit::after{

    content:"";

    position:absolute;

    width:35px;

    height:35px;

    border-radius:50%;

    background:
    linear-gradient(
        135deg,
        #ffffff,
        var(--purple)
    );

    top:15px;

    left:40px;

    box-shadow:
    0 0 40px var(--purple);

}

/* MAIN 3D BALL */

.main-orb{

    position:absolute;

    width:280px;

    height:280px;

    border-radius:50%;

    left:50%;

    top:50%;

    transform:
    translate(-50%,-50%);

    background:

    radial-gradient(

        circle at 30% 25%,

        #ffffff 0%,

        #a855f7 10%,

        #5b21b6 30%,

        #151020 62%,

        #050507 100%

    );

    box-shadow:

    0 0 100px
    rgba(124,58,237,.55),

    inset
    -25px -30px 60px
    rgba(0,0,0,.7);

    animation:
    floatOrb 6s ease-in-out infinite;

}

.main-orb::after{

    content:"";

    position:absolute;

    width:70px;

    height:70px;

    border-radius:50%;

    background:
    rgba(255,255,255,.25);

    filter:blur(8px);

    top:40px;

    left:45px;

}

/* SMALL ORBS */

.small-orb{

    position:absolute;

    border-radius:50%;

}

.orb-one{

    width:100px;

    height:100px;

    top:70px;

    right:35px;

    background:

    radial-gradient(
        circle at 30% 25%,
        white,
        #2997ff 25%,
        #071a2f 75%
    );

    box-shadow:
    0 0 60px
    rgba(41,151,255,.45);

    animation:
    floatSmall 5s ease-in-out infinite;

}

.orb-two{

    width:75px;

    height:75px;

    bottom:70px;

    left:35px;

    background:

    radial-gradient(
        circle at 30% 25%,
        #fff,
        #ffd60a,
        #4c3800
    );

    box-shadow:
    0 0 50px
    rgba(255,214,10,.35);

    animation:
    floatSmall 7s ease-in-out infinite reverse;

}

/* FLOATING CARDS */

.float-card{

    position:absolute;

    padding:18px 20px;

    min-width:170px;

    border-radius:22px;

    background:
    rgba(15,15,22,.72);

    backdrop-filter:
    blur(20px);

    border:
    1px solid
    rgba(255,255,255,.12);

    box-shadow:
    0 20px 50px
    rgba(0,0,0,.35);

}

.float-card i{

    color:#a855f7;

    font-size:22px;

    margin-bottom:10px;

}

.float-card b{

    display:block;

    font-size:14px;

}

.float-card p{

    color:var(--muted);

    font-size:11px;

    margin-top:6px;

}

.card-top{

    top:90px;

    left:0;

    animation:
    floatCard 6s ease-in-out infinite;

}

.card-bottom{

    right:0;

    bottom:90px;

    animation:
    floatCard 7s ease-in-out infinite reverse;

}

/* =========================================
   SECTIONS
========================================= */

section{

    padding:110px 0;

}

.kicker{

    color:#a855f7;

    font-size:12px;

    font-weight:900;

    letter-spacing:3px;

}

.title{

    margin-top:14px;

    font-size:
    clamp(42px,6vw,72px);

    line-height:1;

    letter-spacing:-4px;

}

.description{

    margin-top:20px;

    max-width:650px;

    color:var(--muted);

    line-height:1.9;

}

/* =========================================
   ABOUT
========================================= */

.about-card{

    margin-top:50px;

    display:grid;

    grid-template-columns:
    .8fr 1.2fr;

    gap:50px;

    align-items:center;

    padding:50px;

    border-radius:36px;

    background:

    linear-gradient(
        145deg,
        rgba(255,255,255,.07),
        rgba(255,255,255,.02)
    );

    border:
    1px solid var(--border);

}

.about-visual{

    min-height:350px;

    display:flex;

    align-items:center;

    justify-content:center;

    position:relative;

}

.about-cube{

    width:170px;

    height:170px;

    border-radius:35px;

    display:flex;

    align-items:center;

    justify-content:center;

    font-size:70px;

    color:white;

    background:

    linear-gradient(
        135deg,
        var(--purple),
        var(--blue)
    );

    transform:
    rotateX(15deg)
    rotateY(-20deg)
    rotateZ(8deg);

    box-shadow:

    25px 25px 60px
    rgba(0,0,0,.6),

    0 0 70px
    rgba(124,58,237,.35);

    animation:
    cubeFloat 6s ease-in-out infinite;

}

.about-content h3{

    font-size:32px;

    letter-spacing:-1px;

}

.about-list{

    display:grid;

    gap:15px;

    margin-top:28px;

}

.about-item{

    display:flex;

    gap:14px;

    align-items:center;

    color:#b7b7c0;

}

.about-item i{

    width:35px;

    height:35px;

    display:flex;

    align-items:center;

    justify-content:center;

    border-radius:12px;

    color:#a855f7;

    background:
    rgba(168,85,247,.12);

}

/* =========================================
   SKILLS
========================================= */

.skills-grid{

    margin-top:45px;

    display:grid;

    grid-template-columns:
    repeat(4,1fr);

    gap:18px;

}

.skill{

    min-height:240px;

    padding:28px;

    border-radius:28px;

    position:relative;

    overflow:hidden;

    background:

    linear-gradient(
        145deg,
        rgba(255,255,255,.07),
        rgba(255,255,255,.02)
    );

    border:
    1px solid var(--border);

    transition:.4s;

}

.skill::before{

    content:"";

    position:absolute;

    width:160px;

    height:160px;

    border-radius:50%;

    background:
    rgba(124,58,237,.15);

    filter:blur(30px);

    right:-80px;

    top:-80px;

}

.skill:hover{

    transform:
    translateY(-12px)
    rotateX(3deg);

    border-color:
    rgba(168,85,247,.5);

    box-shadow:
    0 25px 50px
    rgba(0,0,0,.3);

}

.skill i{

    font-size:40px;

    color:#a855f7;

    margin-bottom:50px;

}

.skill h3{

    font-size:21px;

}

.skill p{

    margin-top:10px;

    color:var(--muted);

    font-size:13px;

    line-height:1.7;

}

/* =========================================
   PROJECTS
========================================= */

.projects-grid{

    display:grid;

    grid-template-columns:
    repeat(2,1fr);

    gap:22px;

    margin-top:45px;

}

.project{

    min-height:340px;

    padding:35px;

    border-radius:32px;

    position:relative;

    overflow:hidden;

    background:

    linear-gradient(
        145deg,
        rgba(255,255,255,.06),
        rgba(255,255,255,.02)
    );

    border:
    1px solid var(--border);

    transition:.4s;

}

.project:hover{

    transform:
    translateY(-10px);

    border-color:
    rgba(168,85,247,.45);

}

.project-number{

    position:absolute;

    right:25px;

    top:15px;

    font-size:80px;

    font-weight:900;

    color:
    rgba(255,255,255,.035);

}

.project i{

    font-size:52px;

    color:#8b5cf6;

    margin-bottom:70px;

}

.project h3{

    font-size:27px;

    letter-spacing:-1px;

}

.project p{

    color:var(--muted);

    margin-top:12px;

    line-height:1.8;

    font-size:14px;

}

/* =========================================
   CONTACT
========================================= */

.contact-box{

    margin-top:45px;

    padding:70px 35px;

    border-radius:40px;

    text-align:center;

    position:relative;

    overflow:hidden;

    background:

    radial-gradient(
        circle at 50% 0%,
        rgba(124,58,237,.25),
        transparent 35%
    ),

    linear-gradient(
        145deg,
        rgba(255,255,255,.06),
        rgba(255,255,255,.02)
    );

    border:
    1px solid var(--border);

}

.contact-box::before{

    content:"";

    position:absolute;

    width:300px;

    height:300px;

    border-radius:50%;

    background:
    rgba(41,151,255,.08);

    filter:blur(70px);

    left:-120px;

    bottom:-150px;

}

.contact-box h2{

    position:relative;

    z-index:1;

    font-size:
    clamp(45px,7vw,85px);

    letter-spacing:-5px;

    line-height:.95;

}

.contact-box p{

    position:relative;

    z-index:1;

    color:var(--muted);

    margin-top:20px;

}

.contact-buttons{

    position:relative;

    z-index:1;

    margin-top:40px;

    display:flex;

    justify-content:center;

    flex-wrap:wrap;

    gap:12px;

}

.contact-btn{

    text-decoration:none;

    color:white;

    padding:16px 20px;

    border-radius:16px;

    background:
    rgba(255,255,255,.06);

    border:
    1px solid var(--border);

    font-size:14px;

    font-weight:700;

    transition:.35s;

}

.contact-btn i{

    margin-right:8px;

    color:#a855f7;

}

.contact-btn:hover{

    transform:
    translateY(-6px)
    scale(1.04);

    background:
    rgba(124,58,237,.16);

}

/* =========================================
   FOOTER
========================================= */

footer{

    margin-top:20px;

    border-top:
    1px solid var(--border);

    background:
    rgba(255,255,255,.015);

}

.footer-container{

    width:min(1180px,92%);

    margin:auto;

    padding:65px 0 25px;

}

.footer-top{

    display:grid;

    grid-template-columns:
    1.4fr 1fr 1fr;

    gap:50px;

    padding-bottom:50px;

}

.footer-brand h2{

    font-size:30px;

    letter-spacing:-2px;

}

.footer-brand h2 span{

    color:#a855f7;

}

.footer-brand p{

    margin-top:15px;

    max-width:350px;

    color:var(--muted);

    line-height:1.8;

    font-size:14px;

}

.footer-socials{

    display:flex;

    gap:10px;

    margin-top:22px;

}

.social{

    width:42px;

    height:42px;

    display:flex;

    align-items:center;

    justify-content:center;

    border-radius:13px;

    text-decoration:none;

    color:white;

    background:
    rgba(255,255,255,.05);

    border:
    1px solid var(--border);

    transition:.3s;

}

.social:hover{

    transform:
    translateY(-5px);

    color:#a855f7;

}

.footer-links h3{

    font-size:15px;

    margin-bottom:20px;

}

.footer-links a{

    display:block;

    width:max-content;

    text-decoration:none;

    color:var(--muted);

    margin-bottom:13px;

    font-size:13px;

    transition:.3s;

}

.footer-links a:hover{

    color:white;

    transform:
    translateX(5px);

}

.footer-bottom{

    padding-top:25px;

    border-top:
    1px solid var(--border);

    display:flex;

    justify-content:space-between;

    align-items:center;

    gap:15px;

    color:#777781;

    font-size:12px;

}

.footer-bottom span{

    color:#a855f7;

}

/* =========================================
   ANIMATIONS
========================================= */

@keyframes spin{

    from{

        transform:
        translate(-50%,-50%)
        rotateX(68deg)
        rotateZ(0deg);

    }

    to{

        transform:
        translate(-50%,-50%)
        rotateX(68deg)
        rotateZ(360deg);

    }

}

@keyframes floatOrb{

    0%,100%{

        transform:
        translate(-50%,-50%)
        translateY(0px);

    }

    50%{

        transform:
        translate(-50%,-50%)
        translateY(-25px);

    }

}

@keyframes floatSmall{

    0%,100%{

        transform:
        translateY(0px);

    }

    50%{

        transform:
        translateY(-20px);

    }

}

@keyframes floatCard{

    0%,100%{

        transform:
        translateY(0px);

    }

    50%{

        transform:
        translateY(-15px);

    }

}

@keyframes cubeFloat{

    0%,100%{

        transform:

        rotateX(15deg)
        rotateY(-20deg)
        rotateZ(8deg)

        translateY(0);

    }

    50%{

        transform:

        rotateX(25deg)
        rotateY(-30deg)
        rotateZ(-5deg)

        translateY(-18px);

    }

}

/* =========================================
   MOBILE
========================================= */

@media(max-width:950px){

    .hero-grid{

        grid-template-columns:1fr;

        text-align:center;

    }

    .hero-text{

        margin:auto;

    }

    .buttons{

        justify-content:center;

    }

    .visual{

        margin-top:20px;

        height:500px;

    }

    .about-card{

        grid-template-columns:1fr;

    }

    .skills-grid{

        grid-template-columns:
        repeat(2,1fr);

    }

    .footer-top{

        grid-template-columns:1fr 1fr;

    }

}

@media(max-width:700px){

    nav{

        height:62px;

        padding:0 17px;

    }

    .navlinks{

        display:none;

    }

    .nav-btn{

        padding:10px 14px;

        font-size:12px;

    }

    .hero{

        padding-top:115px;

    }

    .hero h1{

        letter-spacing:-4px;

    }

    .stats{

        grid-template-columns:1fr;

    }

    .visual{

        transform:scale(.82);

        transform-origin:center;

        margin-top:-30px;

    }

    .skills-grid{

        grid-template-columns:1fr;

    }

    .projects-grid{

        grid-template-columns:1fr;

    }

    .about-card{

        padding:28px;

    }

    .footer-top{

        grid-template-columns:1fr;

        gap:35px;

    }

    .footer-bottom{

        flex-direction:column;

        text-align:center;

    }

    .contact-box{

        padding:55px 20px;

    }

}

</style>

</head>


<body>

AM<span>.</span>

</div>

===================================
